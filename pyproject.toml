[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qm_emma"
version = "0.1.0"
description = "Persistent GPU4PySCF backend for AMBER QM/MM EXTERN calculations"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "qm_emma developers"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Chemistry"
]

[project.scripts]
qm_emma-daemon = "qm_emma.daemon:main"

[tool.setuptools]
packages = ["qm_emma"]
script-files = ["bin/qm_emma"]
